<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: #f4f4f4;
    }

    header {
      background: #333;
      color: #fff;
      padding: 20px 0;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    nav ul {
      padding: 0;
      list-style: none;
      background: #444;
      display: flex;
      justify-content: center;
      margin: 0;
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      color: #fff;
      text-decoration: none;
      display: block;
      padding: 15px;
    }

    nav ul li a:hover {
      background: #555;
    }

    .hero {
      background: #007BFF;
      color: white;
      padding: 100px 20px;
      text-align: center;
    }

    .hero h2 {
      margin-top: 0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      background: white;
    }

    .section {
      margin-bottom: 40px;
    }

    .section h2 {
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }

    .projects {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .project {
      flex: 1 1 calc(50% - 20px);
      border: 1px solid #ccc;
      padding: 15px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }

    .project img {
      width: 100%;
      height: auto;
    }

    form label {
      display: block;
      margin-top: 10px;
    }

    form input, form textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
